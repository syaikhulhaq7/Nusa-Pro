<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nusa Pro — POS</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#172033;--muted:#74809a;--primary:#6c5ce7;--primary2:#8b7cf6;--border:#e9eaf1;--success:#16a085}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,#e9e4ff,transparent 35%),var(--bg)}
.login-card{width:min(420px,100%);background:#fff;border:1px solid var(--border);border-radius:28px;padding:34px;box-shadow:0 25px 70px #25204d18}.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:24px}.logo-mark{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;display:grid;place-items:center;font-weight:900}.tag{color:var(--muted);margin:8px 0 28px}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field select{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:12px;outline:none;background:#fff}.field input:focus{border-color:var(--primary)}.btn{border:0;border-radius:12px;padding:13px 16px;cursor:pointer;font-weight:800}.btn-primary{width:100%;background:var(--primary);color:#fff}.demo{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}
.app{min-height:100vh}.top{height:72px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.brand .logo-mark{width:38px;height:38px;border-radius:12px}.lang{padding:9px;border:1px solid var(--border);border-radius:10px;background:#fff}.user{display:flex;gap:10px;align-items:center;margin-left:12px}.avatar{width:34px;height:34px;border-radius:50%;background:#e9e4ff;color:var(--primary);display:grid;place-items:center;font-weight:800}.layout{display:flex}.side{width:235px;background:#fff;min-height:calc(100vh - 72px);border-right:1px solid var(--border);padding:18px 12px}.nav{display:flex;flex-direction:column;gap:6px}.nav button{border:0;background:transparent;text-align:left;padding:12px 14px;border-radius:12px;color:var(--muted);font-weight:700;cursor:pointer}.nav button.active,.nav button:hover{background:#f0edff;color:var(--primary)}.main{padding:28px;flex:1;max-width:1400px}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.title h1{margin:0;font-size:28px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px}.stat-label{color:var(--muted);font-size:13px}.stat{font-size:26px;font-weight:900;margin-top:7px}.accent{color:var(--primary)}.section{margin-top:20px}.section h2{font-size:18px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:14px;border-bottom:1px solid var(--border);font-size:13px}.pill{padding:5px 9px;border-radius:20px;background:#e9faf5;color:var(--success);font-weight:800}.mobile-menu{display:none}
@media(max-width:850px){.side{display:none}.mobile-menu{display:block}.grid{grid-template-columns:repeat(2,1fr)}.main{padding:18px}.top{padding:0 14px}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.title h1{font-size:23px}.user span{display:none}}
</style>
</head>
<body>
<div id="login" class="login"><div class="login-card"><div class="logo"><div class="logo-mark">N</div><div>Nusa Pro</div></div><p class="tag" data-i18n="tag">Smart POS untuk bisnis modern.</p><div class="field"><label data-i18n="email">Email</label><input id="email" value="demo@nusapro.id" type="email"></div><div class="field"><label data-i18n="password">Password</label><input id="password" value="123456" type="password"></div><button class="btn btn-primary" onclick="login()" data-i18n="login">Masuk</button><p class="demo">Demo: demo@nusapro.id / 123456</p></div></div>
<div id="app" class="app hidden"><header class="top"><div class="brand"><div class="logo-mark">N</div><span>Nusa Pro</span></div><div style="display:flex;align-items:center"><select id="lang" class="lang" onchange="setLang(this.value)"><option value="id">🇮🇩 Indonesia</option><option value="en">🇬🇧 English</option><option value="zh">🇨🇳 中文</option></select><div class="user"><div class="avatar">SH</div><span>Syaikhul</span></div></div></header><div class="layout"><aside class="side"><nav class="nav"><button class="active" onclick="show('dashboard',this)" data-i18n="dashboard">⌂ Dashboard</button><button onclick="show('pos',this)" data-i18n="pos">▣ POS / Transaksi</button><button onclick="show('products',this)" data-i18n="products">◫ Produk</button><button onclick="show('stock',this)" data-i18n="stock">◩ Stok</button><button onclick="show('reports',this)" data-i18n="reports">▥ Laporan</button><button onclick="show('settings',this)" data-i18n="settings">⚙ Pengaturan</button></nav></aside><main id="main" class="main"></main></div></div>
<script>
const t={id:{tag:'Smart POS untuk bisnis modern.',email:'Email',password:'Password',login:'Masuk',dashboard:'⌂ Dashboard',pos:'▣ POS / Transaksi',products:'◫ Produk',stock:'◩ Stok',reports:'▥ Laporan',settings:'⚙ Pengaturan',welcome:'Selamat datang kembali 👋',overview:'Ringkasan bisnis hari ini',sales:'Penjualan Hari Ini',orders:'Transaksi',productsCount:'Produk Aktif',low:'Stok Menipis',recent:'Transaksi Terbaru',customer:'Pelanggan',amount:'Total',status:'Status',paid:'Lunas'},en:{tag:'Smart POS for modern businesses.',email:'Email',password:'Password',login:'Sign in',dashboard:'⌂ Dashboard',pos:'▣ POS / Transactions',products:'◫ Products',stock:'◩ Inventory',reports:'▥ Reports',settings:'⚙ Settings',welcome:'Welcome back 👋',overview:'Business overview today',sales:'Today Sales',orders:'Transactions',productsCount:'Active Products',low:'Low Stock',recent:'Recent Transactions',customer:'Customer',amount:'Total',status:'Status',paid:'Paid'},zh:{tag:'为现代企业打造的智能 POS。',email:'邮箱',password:'密码',login:'登录',dashboard:'⌂ 仪表板',pos:'▣ POS / 交易',products:'◫ 产品',stock:'◩ 库存',reports:'▥ 报表',settings:'⚙ 设置',welcome:'欢迎回来 👋',overview:'今日业务概览',sales:'今日销售',orders:'交易',productsCount:'活跃产品',low:'库存不足',recent:'最近交易',customer:'客户',amount:'总计',status:'状态',paid:'已付款'}};
let lang='id';let current='dashboard';
function login(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render()}
function setLang(v){lang=v;document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t[lang][e.dataset.i18n]||e.textContent);render()}
function show(page,el){current=page;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));el.classList.add('active');render()}
function render(){const x=t[lang];let html='';if(current==='dashboard')html=`<div class="title"><div><h1>${x.welcome}</h1><div style="color:var(--muted);margin-top:5px">${x.overview}</div></div><button class="btn btn-primary" style="width:auto" onclick="show('pos',document.querySelectorAll('.nav button')[1])">+ ${x.pos.split(' ').slice(1).join(' ')}</button></div><div class="grid"><div class="card"><div class="stat-label">${x.sales}</div><div class="stat">Rp 12.450.000</div><div class="stat-label accent">+12.5%</div></div><div class="card"><div class="stat-label">${x.orders}</div><div class="stat">128</div><div class="stat-label">Hari ini</div></div><div class="card"><div class="stat-label">${x.productsCount}</div><div class="stat">246</div><div class="stat-label">SKU</div></div><div class="card"><div class="stat-label">${x.low}</div><div class="stat">7</div><div class="stat-label" style="color:#e67e22">Perlu restock</div></div></div><div class="card section"><h2>${x.recent}</h2><table class="table"><thead><tr><th>ID</th><th>${x.customer}</th><th>${x.amount}</th><th>${x.status}</th></tr></thead><tbody><tr><td>#NP-1028</td><td>Andi</td><td>Rp 450.000</td><td><span class="pill">${x.paid}</span></td></tr><tr><td>#NP-1027</td><td>Rina</td><td>Rp 275.000</td><td><span class="pill">${x.paid}</span></td></tr><tr><td>#NP-1026</td><td>Fajar</td><td>Rp 820.000</td><td><span class="pill">${x.paid}</span></td></tr></tbody></table></div>`;else html=`<div class="title"><h1>${document.querySelector('.nav button.active')?.textContent||current}</h1></div><div class="card"><h2>${lang==='id'?'Halaman siap digunakan':'Page ready'}</h2><p style="color:var(--muted)">${lang==='id'?'Ini adalah prototype Nusa Pro. Modul ini siap dikembangkan menjadi fitur operasional penuh.':'This is the Nusa Pro prototype. This module is ready to be expanded into a full operational feature.'}</p></div>`;document.getElementById('main').innerHTML=html;document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t[lang][e.dataset.i18n]||e.textContent)}
</script>
</body></html>
